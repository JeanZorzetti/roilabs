server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 03/10/2026: goiania was shut down and every URL now 301s to Tape Pro, which sells the same
    # tape catalog. With both live, Google kept ONE version inside roilabs.com.br and dropped
    # tapepro.roilabs.com.br entirely on 2026-08-08. Targets are final URLs (trailing slash is
    # Tape's rule) so no request goes through a redirect chain.

    # Only what lets Google re-read the old URLs and find the 301s stays served: the old
    # robots.txt + sitemap.xml, Bing verification and the IndexNow key.
    location ~ "^/(robots\.txt|sitemap\.xml|BingSiteAuth\.xml|[0-9a-f]{32}\.txt)$" {
        try_files $uri =404;
    }

    # Maná left this build (015 A3) and lives at mana.roilabs.com.br: not goiania traffic.
    location ~ ^/mana/(.*)$ {
        return 301 https://mana.roilabs.com.br/$1;
    }

    location ~ ^/fitas/(fita-gomada|fita-transparente-personalizada|fita-transparente-comum)/?$ {
        return 301 https://tapepro.roilabs.com.br/produtos/$1/;
    }
    location ~ ^/fitas(/|$) {
        return 301 https://tapepro.roilabs.com.br/produtos/;
    }
    location ~ ^/guia/como-escolher-fita-adesiva-para-embalagem/?$ {
        return 301 https://tapepro.roilabs.com.br/blog/como-escolher-fita-para-caixa-pesada/;
    }
    location ~ ^/(orcamento|carrinho|carrinho-fitas)/?$ {
        return 301 https://tapepro.roilabs.com.br/orcamento/;
    }
    location ~ ^/sobre/?$ {
        return 301 https://tapepro.roilabs.com.br/sobre/;
    }

    # ponytail: porcelanato, its guides and everything else have no Tape counterpart, so they go
    # to the home. Google treats a 301 to an unrelated page as a soft 404: visitors arrive, those
    # URLs' ranking does not carry over. A real Tape equivalent = one more location above.
    location / {
        return 301 https://tapepro.roilabs.com.br/;
    }
}
