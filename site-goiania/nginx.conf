# 015 T020: dois hosts, um container, um build. `server_name _` continua sendo o
# catch-all do goiania (default_server implícito por ser o 1º bloco) — o 2º server{}
# abaixo só entra quando o Host: bate com mana.roilabs.com.br.
server {
    listen 80;
    server_name _;

    # Behind the EasyPanel TLS proxy: keep redirects relative, otherwise nginx's
    # directory 301 (/x -> /x/) downgrades https to http (seen by Googlebot, GSC 2026-07-03).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 015 D1: as páginas /mana/** existem NESTE build (mesmo root), mas o canônico é o
    # host novo. Sem este 301, o mesmo HTML responderia 200 nos dois hosts — conteúdo
    # duplicado auto-infligido. Location mais específico que `location /` vence sempre,
    # não importa a ordem de declaração.
    location /mana/ {
        return 301 https://mana.roilabs.com.br$request_uri;
    }

    # URL desconhecida = 404 real com página útil. O fallback antigo (/index.html)
    # servia a home com HTTP 200 — soft 404 aos olhos do Google.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 80;
    server_name mana.roilabs.com.br;

    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── CONTENÇÃO (2026-08-18) ──────────────────────────────────────────────────
    # O root é COMPARTILHADO com o goiania, então o default era servir o site do
    # porcelanato inteiro sob a marca Maná: `/` respondia a home de fitas adesivas,
    # e /porcelanato/, /carrinho/, /guia/... todos 200 neste host. Conteúdo duplicado
    # num host inteiro, com a home da marca sendo a página de outro negócio.
    #
    # Enquanto o site próprio da Maná (projeto separado, igual Tapepro) não sobe,
    # este host vira ALLOWLIST: só o que pertence à Maná responde. Tudo mais é 404.
    # Isto é ponte, não destino — o destino é a Maná sair deste build.

    # A home da marca é a vitrine da Maná, não a do porcelanato.
    # 302, não 301: quando o site próprio subir, a Maná mora em `/` e este redirect
    # INVERTE (/mana/ -> /). 301 fica cacheado no browser e no Google e ia brigar com
    # o destino final. Ponte se sinaliza como temporária.
    location = / {
        return 302 /mana/;
    }

    # /mana sem barra: o try_files antigo gerava o 301 pro diretório. A allowlist não,
    # então o redirect vira explícito — URL digitada à mão não pode virar 404.
    location = /mana { return 302 /mana/; }
    location /mana/ { }

    # Assets que as páginas da Maná realmente referenciam (conferido no HTML em prod).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /img/mana/ { }
    location /fonts/    { }
    location = /favicon.png      { }
    location = /roilabs-icon.png { }

    # Root do nginx é COMPARTILHADO entre os dois hosts — sem isto, /sitemap.xml
    # serviria o sitemap do porcelanato para quem pede em mana.roilabs.com.br.
    location = /sitemap.xml { try_files /mana/sitemap.xml =404; }
    location = /robots.txt  { try_files /mana/robots.txt =404; }
    location = /llms.txt    { try_files /mana/llms.txt =404; }

    # Servida como arquivo, fora da allowlist geral: sem este location exato o
    # error_page abaixo cairia no catch-all `return 404` e viraria ciclo interno.
    location = /404.html { }
    error_page 404 /404.html;

    # Qualquer outra URL é do goiania, e o goiania não mora neste host.
    location / {
        return 404;
    }
}
