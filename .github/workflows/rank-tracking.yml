# Rank tracking semanal da malha pSEO (goiania.roilabs.com.br) — segunda 09:00 UTC.
# Resultado commitado direto no vault (Docs/Obsidian/rank-tracking.{csv,md}).
# Fonte preferida: secret SERPER_API_KEY (serper.dev, 2.500 buscas grátis, sem cartão);
# fallback: DATAFORSEO_API_KEY (precisa de saldo na conta — zerou em 2026-07-03).
name: rank-tracking

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site-goiania/src/scripts/rank-tracking.mjs
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
      - run: |
          git config user.name "rank-tracking"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/Obsidian/rank-tracking.csv Docs/Obsidian/rank-tracking.md
          git diff --cached --quiet || { git commit -m "chore: weekly rank tracking $(date -u +%F)"; git push; }
      # Weekly digest e-mail (leads/pedidos/GMV from the DB + this run's rank snapshot).
      # Runs even if rank tracking failed — the DB stats are still worth sending.
      - if: always()
        run: |
          curl -sf -X POST "https://app.roilabs.com.br/api/cron/digest" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: text/plain" \
            --data-binary @Docs/Obsidian/rank-tracking.md || echo "digest skipped"
