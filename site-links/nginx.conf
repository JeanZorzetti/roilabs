server {
    listen 80;
    server_name _;

    # Mesmo motivo do /site: atrás do proxy TLS da EasyPanel, redirect absoluto
    # do nginx derruba https -> http.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fontes e imagens têm nome fixo — cache de 30d, não de 1 ano, pra trocar
    # o logo sem precisar renomear arquivo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # É uma página só: qualquer URL cai nela em vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
