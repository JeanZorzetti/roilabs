server {
    listen 80;
    server_name _;

    # Behind the EasyPanel TLS proxy: keep redirects relative, otherwise nginx's
    # directory 301 (/x -> /x/) downgrades https to http (seen by Googlebot, GSC 2026-07-03).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro hashes asset filenames — safe to cache hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # clean URLs + fallback to index
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
