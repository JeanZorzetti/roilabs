server {
    listen 80;
    server_name _;

    # Behind the EasyPanel TLS proxy: keep redirects relative, otherwise nginx's
    # directory 301 (/x -> /x/) downgrades https to http (seen by Googlebot, GSC 2026-07-03).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # www servia o site inteiro com 200 (A record aponta pro mesmo IP) — host duplicado.
    # O apex é o canônico; sem isso o Googlebot pode rastrear as duas malhas.
    if ($host ~* ^www\.) {
        return 301 https://roilabs.com.br$request_uri;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro hashes asset filenames — safe to cache hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # URL desconhecida = 404 real com página útil. O fallback antigo (/index.html)
    # servia a home com HTTP 200 — soft 404 aos olhos do Google (mesmo fix do goiânia).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
